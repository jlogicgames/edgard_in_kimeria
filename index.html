<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edgard in Kimeria</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      canvas {
        display: block;
        margin: auto;
        image-rendering: pixelated;
      }
    </style>
    <!--
      data-wasm-opt="0": the wasm-opt binary trunk downloads rejects the
      bulk-memory instructions rustc's wasm32-unknown-unknown target emits by
      default, failing the build outright. Skip it rather than chase a
      compatible wasm-opt version for a size optimization.
    -->
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <link data-trunk rel="copy-dir" href="assets" />
  </head>
  <body></body>
</html>
