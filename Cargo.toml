[workspace]
members = ["."]

[package]
name = "edgard_in_kimeria"
version = "0.0.1"
edition = "2024"
description = "Edgard in Kimeria"
license = "MIT"
publish = false

[dependencies]
# `wav` is not a default feature, and every one-shot sound in assets/audio is an
# 8-bit PCM .wav; without it rodio panics on the first sound played. `mp3` is
# likewise off by default and is needed to decode the main-menu music track.
bevy = { version = "0.19", features = ["wav", "mp3"] }
bevy_ecs_tiled = "0.13"
bevy_ecs_tilemap = "0.19"
rand = "0.9"

# wgpu's WebGPU backend isn't available in enough browsers yet; WebGL2 is the
# broadly-supported fallback for the wasm32 target. Cargo unifies this with
# the `bevy` dependency above, so native builds are unaffected.
#
# `rand` pulls in `getrandom`, which refuses to pick a source on
# wasm32-unknown-unknown unless told to use the browser's `crypto` API; see
# the matching `--cfg` in .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", features = ["webgl2"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = []
# `cargo run --features dev`
#   file_watcher:    hot-reloads anything under assets/, WGSL included. This is
#                    the reason the feature exists.
#   dynamic_linking: links Bevy as a shared library. Measured on this crate,
#                    touching one file: 3.4s -> 2.5s. Modest, and it makes the
#                    binary depend on libbevy_dylib from target/.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]

# Debug builds are unplayable without optimised dependencies (sprite decode,
# tilemap upload). Keep our own crate cheap to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Shipping build. Conventional settings, not a tuned result: no frame-rate
# comparison against a plain --release build has been made. Costs about 6
# minutes from clean and yields a 56 MB binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
